# La CI del kit: en cada PR, los scripts pasan shellcheck y los workflows actionlint (los del kit y los que instala
# cada stack), el núcleo y los stacks cuadran con sus manifiestos (tests/structure.sh), y el guardián de cada stack
# pasa sobre una instalación de prueba y detecta cada fallo provocado (tests/run.sh). Los e2e instalan cada stack en
# un proyecto nuevo de verdad y corren su bin/verify.sh completo (tests/e2e-<stack>.sh).
name: kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La misma versión que en local, para que los avisos no cambien con la imagen del runner.
      - name: shellcheck
        run: |
          pip install --quiet shellcheck-py==0.11.0.1
          shellcheck -s sh install.sh core/bin/*.sh stacks/*/bin/*.sh tests/*.sh docs/vps/*.sh

      # Después de shellcheck: actionlint lo usa para revisar los «run:» de los workflows.
      - name: actionlint
        run: |
          pip install --quiet actionlint-py==1.7.12.25
          actionlint .github/workflows/*.yml stacks/*/.github/workflows/*.yml

      - name: estructura
        run: sh tests/structure.sh

      - name: tests
        run: sh tests/run.sh

      # Los scripts prometen POSIX sh y busybox: la imagen habitual de PHP (php:*-alpine) no trae bash. Sí git, que
      # Alpine no trae y bin/check-protocol.sh necesita.
      - name: tests en Alpine (busybox)
        run: docker run --rm -v "$PWD":/k:ro -w /k alpine:3 sh -c 'apk add --no-cache --quiet git && sh tests/run.sh'

  e2e-nextjs:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      E2E_LIGHTHOUSE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # El gate «secretos» de verify.sh lo necesita, como en el workflow del stack.
      - name: gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks

      - name: e2e
        run: sh tests/e2e-nextjs.sh

  e2e-laravel:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    # La suite del proyecto corre contra PostgreSQL con PostGIS, como el workflow del stack.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: pdo_pgsql
          coverage: none

      # El gate «secretos» de verify.sh lo necesita, como en el workflow del stack.
      - name: gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks

      - name: e2e
        run: sh tests/e2e-laravel.sh
