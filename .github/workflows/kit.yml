# La CI del kit: en cada PR, los scripts pasan shellcheck y los workflows actionlint (los del kit y los que instala
# cada stack), el núcleo y los stacks cuadran con sus manifiestos (tests/structure.sh), y el guardián de cada stack
# pasa sobre una instalación de prueba y detecta cada fallo provocado (tests/run.sh). Los e2e de cada stack van en su
# propio workflow (e2e-<stack>.yml), que sólo corre si el PR toca algo que lo afecta.
#
# Sólo en los PRs: corre sobre el resultado de fusionarlo con main, así que repetirla en main tras el merge gastaba
# minutos sin comprobar nada nuevo. Un push nuevo a la rama cancela la ejecución anterior, que ya no cuenta.
name: kit

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La misma versión que en local, para que los avisos no cambien con la imagen del runner.
      - name: shellcheck
        run: |
          pip install --quiet shellcheck-py==0.11.0.1
          shellcheck -s sh install.sh core/bin/*.sh stacks/*/bin/*.sh tests/*.sh docs/vps/*.sh .github/*.sh

      # Después de shellcheck: actionlint lo usa para revisar los «run:» de los workflows.
      - name: actionlint
        run: |
          pip install --quiet actionlint-py==1.7.12.25
          actionlint .github/workflows/*.yml stacks/*/.github/workflows/*.yml

      - name: estructura
        run: sh tests/structure.sh

      - name: tests
        run: sh tests/run.sh

      # Los scripts prometen POSIX sh y busybox: la imagen habitual de PHP (php:*-alpine) no trae bash. Sí git, que
      # Alpine no trae y bin/check-protocol.sh necesita.
      - name: tests en Alpine (busybox)
        run: docker run --rm -v "$PWD":/k:ro -w /k alpine:3 sh -c 'apk add --no-cache --quiet git && sh tests/run.sh'
