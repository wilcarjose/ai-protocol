# .ai/project/verify.conf — lo que bin/verify.sh necesita saber de este proyecto.
#
# Es del proyecto: install.sh lo crea una vez y --upgrade no lo toca. bin/verify.sh, que es del kit, lo lee con «.»
# al empezar, así que aquí sólo van asignaciones de sh.

# BASELINE — sólo se mueve en la dirección buena. La mueve quien cierra una fase que la mejora, en su commit de
# cierre (.claude/skills/phase/cierre.md §Cierre de fase); el diff de este archivo es el registro de esa mejora.
MIN_TESTS=0                # tests de la suite que pasan (nunca baja)
MAX_PHPSTAN_IGNORES=0      # entradas de phpstan-baseline.neon (nunca sube)

# DOCKER COMPOSE — si el proyecto corre en Docker Compose, el servicio de PHP («app», «backend»…): desde el host,
# bin/verify.sh se relanza dentro de él, que necesita además git y gitleaks. Vacío = se ejecuta donde se invoque.
# Una variable de entorno con el mismo nombre gana a lo que diga aquí.
VERIFY_SERVICE=${VERIFY_SERVICE:-}
COMPOSE_CMD=${COMPOSE_CMD:-docker compose}
