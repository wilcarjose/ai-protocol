# verify — en cada PR, bin/verify.sh completo: el mismo árbitro que cierra una fase en local
# (.claude/skills/phase/cierre.md §Entrega). Es del kit ai-protocol y lo actualiza install.sh --upgrade.
#
# La versión de Node sale de «engines.node» de package.json, como la lee actions/setup-node. gitleaks y Lighthouse CI
# van en su versión fijada para que los gates no cambien con el runner.
#
# «lighthouse» construye la app, la arranca y la mide contra los presupuestos de .ai/project/lighthouse.json, que son
# del proyecto. Va aparte de verify.sh: necesita Chrome, que el runner trae.
name: verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  LHCI_VERSION: 0.15.1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Todo el historial y las ramas: el gate «protocolo» compara la rama con su base y «secretos» lee los commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks

      - name: dependencias
        run: npm ci

      - name: verify
        run: sh bin/verify.sh

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: dependencias
        run: npm ci

      - name: build
        run: npx next build

      - name: lighthouse
        run: npx --yes "@lhci/cli@${LHCI_VERSION}" autorun --config=.ai/project/lighthouse.json
