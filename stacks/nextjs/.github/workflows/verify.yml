# verify — en cada PR, bin/verify.sh completo: el mismo árbitro que cierra una fase en local
# (.claude/skills/phase/cierre.md §Entrega). Es del kit ai-protocol y lo actualiza install.sh --upgrade.
#
# La versión de Node sale de «engines.node» de package.json, como la lee actions/setup-node. gitleaks y Lighthouse CI
# van en su versión fijada para que los gates no cambien con el runner.
#
# «lighthouse» construye la app, la arranca y la mide contra los presupuestos de .ai/project/lighthouse.json, que son
# del proyecto. Va aparte de verify.sh: necesita Chrome, que el runner trae.
#
# «changes» dice si el PR toca algo más que documentos, y «lighthouse» sólo corre si es así: un PR que cambia
# STATE.md o un runbook no puede cambiar lo que mide. Un job saltado cuenta como superado, así que sigue valiendo si
# algún día es obligatorio. «verify» corre siempre: lleva los gates del protocolo y de secretos, que sí leen los
# documentos. La lista es corta y de rutas que la app no lee; todo lo demás, incluido .ai/project/lighthouse.json,
# cuenta como código.
name: verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  LHCI_VERSION: 0.15.1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Todo el historial y las ramas: el gate «protocolo» compara la rama con su base y «secretos» lee los commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks

      - name: dependencias
        run: npm ci

      - name: verify
        run: sh bin/verify.sh

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: diff
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          if grep -qvE '^(\.ai/(epics|handoffs|archive)/|docs/|\.claude/)|^\.ai/.*\.md$|^[^/]*\.md$' "$RUNNER_TEMP/changed.txt"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lighthouse:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: dependencias
        run: npm ci

      - name: build
        run: npx next build

      - name: lighthouse
        run: npx --yes "@lhci/cli@${LHCI_VERSION}" autorun --config=.ai/project/lighthouse.json
