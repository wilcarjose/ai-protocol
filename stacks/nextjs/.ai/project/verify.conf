# .ai/project/verify.conf — lo que bin/verify.sh (y bin/protocol-upgrade.sh) necesitan saber de este proyecto.
#
# Es del proyecto: install.sh lo crea una vez y --upgrade no lo toca. bin/verify.sh, que es del kit, lo lee con «.»
# al empezar, así que aquí sólo van asignaciones de sh.

# BASELINE — sólo se mueve en la dirección buena. La mueve quien cierra una fase que la mejora, en su commit de
# cierre (.claude/skills/phase/cierre.md §Cierre de fase); el diff de este archivo es el registro de esa mejora.
MIN_TESTS=0            # tests de Vitest que pasan (nunca baja)
MAX_SUPPRESSIONS=0     # supresiones de eslint-suppressions.json (nunca sube)

# CONTRATO — de dónde salen los tipos del cliente HTTP (bin/contract.sh y el gate «contrato»). La copia del OpenAPI
# del backend y el archivo que se genera de ella; sin estas líneas, valen estos mismos valores.
CONTRACT_SPEC=docs/contract/openapi.json
CONTRACT_TYPES=src/shared/api/schema.d.ts

# UPGRADE DEL PROTOCOLO — si bin/protocol-upgrade.sh fusiona solo su PR cuando la CI pasa: minor (las versiones
# menores y los parches), patch (sólo los parches) o never. Una versión mayor, un conflicto o la CI en rojo esperan
# siempre a la persona. Sin esta línea vale minor; una variable de entorno con el mismo nombre gana.
PROTOCOL_AUTO_MERGE=minor
